<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<meta
  name="theme-color"
  content="#d71920">

<title>JNT KIRIM</title>

<link
  rel="stylesheet"
  href="style.css">

</head>


<body>


<header class="header">

  <div class="brand">

    <div class="logo">

      📦

    </div>

    <div>

      <div class="brand-name">
        JNT KIRIM
      </div>

      <div class="brand-sub">
        FOTO & LOKASI
      </div>

    </div>

  </div>


  <button
    id="switchCamera"
    class="camera-switch"
    type="button">

    🔄

  </button>

</header>



<main class="container">


  <!-- KIRIM DI ATAS -->

  <button
    id="sendButton"
    class="btn btn-send"
    type="button">

    📤 KIRIM GAMBAR

  </button>



  <!-- KAMERA -->

  <section class="card camera-card">

    <div class="camera-title">

      <strong>
        📷 Kamera Depan
      </strong>

      <span
        id="cameraStatus"
        class="status offline">

        Menunggu izin...

      </span>

    </div>


    <div class="camera-box">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>


      <div
        id="cameraOverlay"
        class="camera-overlay">

        Memulai kamera...

      </div>

    </div>


    <button
      id="takePhoto"
      class="btn btn-primary"
      type="button"
      disabled>

      📸 AMBIL GAMBAR

    </button>


    <div
      id="autoStatus"
      class="auto-status">

      ⏳ Menunggu kamera...

    </div>

  </section>



  <!-- DATA -->

  <section class="card">

    <h3>
      📝 Data Pengiriman
    </h3>


    <label for="nama">
      Nama
    </label>


    <input
      id="nama"
      type="text"
      placeholder="Masukkan nama">


    <label for="keterangan">
      Keterangan
    </label>


    <textarea
      id="keterangan"
      placeholder="Masukkan keterangan"></textarea>

  </section>



  <!-- GALERI -->

  <section class="card">

    <h3>
      🖼️ Galeri
    </h3>


    <label class="gallery-button">

      🖼️ PILIH DARI GALERI

      <input
        id="galleryInput"
        type="file"
        accept="image/*"
        multiple
        hidden>

    </label>


    <div
      id="galleryPreview"
      class="gallery-preview">
    </div>

  </section>



  <!-- PROGRESS -->

  <div
    id="progressBox"
    class="progress-box">

    <div class="progress-bar">

      <div id="progress"></div>

    </div>


    <div id="progressText">
      Menunggu...
    </div>

  </div>



  <div
    id="message"
    class="message">
  </div>


</main>



<footer>

  <strong>
    JNT KIRIM
  </strong>

  <small>
    Sistem foto dan lokasi
  </small>

</footer>



<canvas
  id="canvas"
  hidden>
</canvas>



<script src="script.js"></script>

</body>

</html>
